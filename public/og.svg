<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#2B6CB0" />
      <stop offset="0.55" stop-color="#3E7CB8" />
      <stop offset="1" stop-color="#3E8E88" />
    </linearGradient>
    <radialGradient id="wash" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#2B6CB0" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2B6CB0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FAF8F4" />
  <rect width="1200" height="630" fill="url(#wash)" />

  <!-- モノグラム -->
  <g transform="translate(96 96) scale(1.05)">
    <polygon points="48,4 88,26 88,70 48,92 8,70 8,26" fill="none" stroke="url(#grad)" stroke-width="3" />
    <g stroke="url(#grad)" stroke-width="7" stroke-linecap="square" fill="none">
      <path d="M34 28 V68" />
      <path d="M37 48 L58 28" />
      <path d="M37 48 L60 68" />
    </g>
    <circle cx="62" cy="25" r="4" fill="url(#grad)" />
  </g>

  <!-- 名前 -->
  <g transform="translate(236 118)">
    <text x="0" y="42" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#22303C">Takumi-Kdev</text>
    <text x="2" y="78" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" fill="#5B6875">河合巧実 ／ 高校生開発者 ／ 愛知県豊橋市</text>
  </g>

  <!-- コピー -->
  <g transform="translate(96 310)">
    <rect x="0" y="0" width="56" height="3" rx="1.5" fill="#2B6CB0" />
    <text x="0" y="88" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="58" font-weight="600" fill="#22303C">つくって、動かして、記録する。</text>
    <text x="0" y="146" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="22" fill="#5B6875">Build, ship, and document.</text>
  </g>

  <g transform="translate(96 540)">
    <text x="0" y="0" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#2B6CB0">takumi-kdev.github.io</text>
  </g>
</svg>
